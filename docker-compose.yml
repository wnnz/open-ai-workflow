name: ordo

x-build-proxy: &build-proxy
  HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-http://host.docker.internal:10808}
  HTTPS_PROXY: ${CONTAINER_HTTP_PROXY:-http://host.docker.internal:10808}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,api,worker,sandbox,sandbox-docker-proxy}

x-backend: &backend
  image: ordo-api
  build:
    context: ./backend
    args: *build-proxy
  restart: unless-stopped
  env_file: .env
  volumes:
    - file-data:/data/files
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ordo
      POSTGRES_PASSWORD: ordo
      POSTGRES_DB: ordo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordo -d ordo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    networks:
      - default
      - sandbox-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *backend
    command: celery -A app.worker.celery worker --loglevel=INFO --concurrency=1
    networks:
      - default
      - sandbox-runtime

  beat:
    <<: *backend
    profiles: ["schedule"]
    command: celery -A app.worker.celery beat --loglevel=INFO

  sandbox:
    image: ordo-sandbox
    build:
      context: ./sandbox
      args: *build-proxy
    restart: unless-stopped
    environment:
      SANDBOX_SHARED_SECRET: ${SANDBOX_SHARED_SECRET:?SANDBOX_SHARED_SECRET must be set}
      SANDBOX_RUNTIME_IMAGE: ordo-sandbox
      DOCKER_HOST: tcp://sandbox-docker-proxy:2375
    networks:
      - sandbox-runtime
      - sandbox-control
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

  sandbox-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - sandbox-proxy-config:/usr/local/etc/haproxy
    networks:
      - sandbox-control
    read_only: true
    tmpfs:
      - /run:size=1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./frontend
      args: *build-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres-data:
    name: ordo_postgres-data
  redis-data:
    name: ordo_redis-data
  file-data:
    name: ordo_file-data
  sandbox-proxy-config:
    name: ordo_sandbox-proxy-config

networks:
  sandbox-runtime:
    internal: true
  sandbox-control:
    internal: true
