name: weaverun

x-build-proxy: &build-proxy
  HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-http://host.docker.internal:10808}
  HTTPS_PROXY: ${CONTAINER_HTTP_PROXY:-http://host.docker.internal:10808}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,minio,api,worker,sandbox,sandbox-docker-proxy,document-worker}

x-backend: &backend
  image: weaverun-api
  build:
    context: ./backend
    args: *build-proxy
  restart: unless-stopped
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: weaverun
      POSTGRES_PASSWORD: weaverun
      POSTGRES_DB: weaverun
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weaverun"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    networks:
      - default
      - sandbox-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *backend
    command: celery -A app.worker.celery worker --loglevel=INFO --concurrency=1
    networks:
      - default
      - sandbox-runtime

  beat:
    <<: *backend
    command: celery -A app.worker.celery beat --loglevel=INFO

  sandbox:
    image: weaverun-sandbox
    build:
      context: ./sandbox
      args: *build-proxy
    restart: unless-stopped
    environment:
      SANDBOX_SHARED_SECRET: ${SANDBOX_SHARED_SECRET:?SANDBOX_SHARED_SECRET must be set}
      SANDBOX_RUNTIME_IMAGE: weaverun-sandbox
      DOCKER_HOST: tcp://sandbox-docker-proxy:2375
    networks:
      - sandbox-runtime
      - sandbox-control
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

  sandbox-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - sandbox-proxy-config:/usr/local/etc/haproxy
    networks:
      - sandbox-control
    read_only: true
    tmpfs:
      - /run:size=1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  document-worker:
    profiles: ["document"]
    build:
      context: ./document-worker
      args: *build-proxy
    restart: unless-stopped
    ports:
      - "8082:8082"

  web:
    build:
      context: ./frontend
      args: *build-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres-data:
    name: weaverun_postgres-data
  redis-data:
    name: weaverun_redis-data
  minio-data:
    name: weaverun_minio-data
  sandbox-proxy-config:
    name: weaverun_sandbox-proxy-config

networks:
  sandbox-runtime:
    internal: true
  sandbox-control:
    internal: true
